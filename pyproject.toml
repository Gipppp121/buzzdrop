[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "buzzdrop"
version = "0.1.0"
description = "Turn robot footage into a fly-courier delivery HUD: neural visualization + order card, driven by optical flow."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "GIPP" }]
dependencies = ["numpy>=1.24", "opencv-python-headless>=4.8", "pillow>=10.1"]
keywords = ["robot", "hud", "overlay", "optical-flow", "video", "drosophila"]

[project.urls]
Homepage = "https://github.com/Gipppp121/buzzdrop"

[project.scripts]
buzzdrop = "buzzdrop.cli:main"

[tool.setuptools]
packages = ["buzzdrop"]
