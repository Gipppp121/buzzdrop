name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: game.js parses
        run: node --check src/game.js
      - name: index.html matches src/
        run: python tools/build.py --check
      - name: tools compile
        run: python -m py_compile tools/build.py tools/record.py
